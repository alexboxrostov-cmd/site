name: Auto-merge Qwen PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # НОВОЕ УСЛОВИЕ: Проверяем, что ветка начинается с fix-page- (так Qwen называет свои ветки)
    if: startsWith(github.event.pull_request.head.ref, 'fix-page-')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
