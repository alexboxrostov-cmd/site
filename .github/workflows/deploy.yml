name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Путь на сервере, куда загружать (из вашего FAR Manager)
        server-dir: /domains/a0650449.xsph.ru/public_html/LOGISTIC/
        # Что загружать. Загружаем только то, что находится в папке public
        local-dir: ./public/
        # Включаем подробный лог, чтобы видеть, на чем спотыкается
        log-level: verbose
