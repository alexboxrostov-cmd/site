name: Auto-merge Qwen PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Срабатывает только для PR от Qwen
    if: startsWith(github.event.pull_request.head.ref, 'fix-page-')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # Ваш токен для авто-слияния

      - name: Wait for PR to be merged and trigger deploy
        # Ждем, пока PR реально сольется, и запускаем деплой
        run: |
          for i in $(seq 1 30); do
            STATE=$(gh pr view "${{ github.event.pull_request.html_url }}" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged. Triggering deploy..."
              gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
              exit 0
            fi
            sleep 10
          done
          echo "::warning::PR did not merge in time; run deploy.yml manually"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # Ваш токен для запуска деплоя
