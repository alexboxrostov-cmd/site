            var groupSum = 0, groupClients = 0, groupReturns = 0, groupCancelled = 0;
            var allGroupClients = [], allClientsNames = [], allSumsArr = [], allAddresses = [];
            var groupDrivers = {};
            var groupTaskNumbers = [];
            group.rows.forEach(function(r) {
                groupSum += r.СуммаМаршрута || 0;
                groupClients += r.КолКлиентов || 0;
                groupReturns += r.Возвраты || 0;
                groupCancelled += r.Отменено || 0;
                if (r.Водитель && r.Водитель.ФИО) groupDrivers[r.Водитель.ФИО] = true;
                if (r.НомерЗадания && groupTaskNumbers.indexOf(r.НомерЗадания) === -1) {
                    groupTaskNumbers.push(r.НомерЗадания);
                }
                if (r.Клиенты && r.Клиенты.length > 0) {
                    r.Клиенты.forEach(function(c) {
                        allGroupClients.push(c);
                        allClientsNames.push(c.Наименование);
                        allSumsArr.push((isCancelledClient(c) ? 0 : (c.Сумма || 0)).toFixed(2));
                        if (c.Адрес && c.Адрес.trim() !== '') allAddresses.push(c.Адрес.trim());
                    });
                }
            });
            var driversStr = Object.keys(groupDrivers).join(', ') || 'Неизвестный водитель';
            var taskNumbersStr = groupTaskNumbers.join(' / ') || '';
            daySum += groupSum; weekSum += groupSum;
            dayClients += groupClients; weekClients += groupClients;
            dayGroups++; weekGroups++;
            var avgDay = dayGroups > 0 ? (dayClients / dayGroups) : 0;
            var avgWeek = weekGroups > 0 ? (weekClients / weekGroups) : 0;
            var sumWNDS = groupSum * 100 / 122;
            var margin = sumWNDS * 0.17;

            var dayName = dayNames[dateObj.getDay()];
            var classDay = 'day-' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dateObj.getDay()];
            var rowId = 'row_' + routeIndex + '_g' + rowIndex;

            var timeKey = dateKey + '_' + padZero(dateObj.getHours()) + ':' + padZero(dateObj.getMinutes());
            var dateStr = formatDate(dateObj);
            var timeStr = padZero(dateObj.getHours()) + ':' + padZero(dateObj.getMinutes());
            var queue = firstRow.Очередь || '';

            var timeHtml = isGroup
                ? '<span class="group-arrow" data-parent-id="' + rowId + '" onclick="event.stopPropagation(); toggleGroup(\'' + rowId + '\')">▸</span>' + timeStr
                : timeStr;

            var rowValues = {
                'date':       { html: '<span class="clickable-date" data-date="' + escapeAttr(dateStr) + '">' + dateStr + '</span>' },
                'day':        { text: dayName, cls: 'day-cell', onclick: 'filterByDay(this)' },
                'time':       { html: timeHtml, cls: 'time-cell', onclick: 'filterByTime(this)', attr: firstInDay ? {'data-first':'true'} : {} },
                'queue':      { text: group.plan + '-я плановая', cls: 'queue-cell', onclick: 'filterByQueue(this)', attr: { 'data-queue': queue, 'title': queue } },
                'clients':    { text: groupClients, cls: 'bold-text' },
                'avg-day':    { text: avgDay.toFixed(2), style: 'text-align:right;' },
                'avg-week':   { text: avgWeek.toFixed(2), style: 'text-align:right;' },
                'sum-route':  { text: fmt(groupSum), cls: 'bold-text', style: 'text-align:right;' },
                'sum-day':    { text: fmt(daySum), style: 'text-align:right;' },
                'sum-week':   { text: fmt(weekSum), style: 'text-align:right;' },
                'sum-nds':    { text: fmt(sumWNDS), style: 'text-align:right;' },
                'exp-client': { text: '0', style: 'text-align:right;' },
                'exp-route':  { text: '0', style: 'text-align:right;' },
                'margin':     { text: fmt(margin), cls: 'margin-bold', style: 'text-align:right;' },
                'cost':       { text: '0', style: 'text-align:right;' },
                'cost-cum':   { text: '0', style: 'text-align:right;' },
                'dohod':      { text: '0', style: 'text-align:right;' },
                'dohod-itog': { text: '0', style: 'text-align:right;' },
                'dohod-cum':  { text: '0', style: 'text-align:right;' },
                'km':         { text: '—', style: 'text-align:right;' },
                'time-calc':  { text: '—', style: 'text-align:right;' },
                'returns':    { text: groupReturns },
                'cancelled':  { text: groupCancelled }
            };
            var trAttrs = {
                'data-row-id': rowId,
                'data-datetime': firstRow.ДатаВремя,
                'data-plan': String(group.plan),
                'data-day-key': dayName,
                'data-original-sum': groupSum,
                'data-clients-count': groupClients,
                'data-clients': allClientsNames.join('|'),
                'data-client-sums': allSumsArr.join('|'),
                'data-clients-addresses': allAddresses.join('||'),
                'data-date-key': dateKey,
                'data-week-num': String(weekNumber),
                'data-time-key': timeKey,
                'data-task-numbers': taskNumbersStr
            };
            var tr = buildRow(rowValues, trAttrs, classDay);
            var dateSpan = tr.querySelector('.clickable-date');
            if (dateSpan) {
                dateSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var dt = this.getAttribute('data-date') || dateStr;
                    showPopup(e, allGroupClients, dt, rowId, null, queue, timeStr, driversStr, taskNumbersStr, routeName);
                });
            }
            tbody.appendChild(tr);
            firstInDay = false;

            if (isGroup) {
                for (var k = 1; k < group.rows.length; k++) {
                    var chRow = group.rows[k];
                    var chDate = new Date(chRow.ДатаВремя);
                    var chTime = padZero(chDate.getHours()) + ':' + padZero(chDate.getMinutes());
                    var chValues = {
                        'time':      { text: chTime, cls: 'time-cell' },
                        'clients':   { text: chRow.КолКлиентов || 0 },
                        'sum-route': { text: fmt(chRow.СуммаМаршрута || 0), style: 'text-align:right;' },
                        'returns':   { text: chRow.Возвраты || 0 },
                        'cancelled': { text: chRow.Отменено || 0 }
                    };
                    var chTr = buildRow(chValues, { 'data-parent-id': rowId }, 'group-child');
                    chTr.style.display = 'none';
                    tbody.appendChild(chTr);
                }
            }
        });

        table.appendChild(tbody);
        content.appendChild(table);
        acc.appendChild(content);
        routesWrap.appendChild(acc);
    });

    setTimeout(function() {
        applyAllFilters();
        updateAllRouteCosts();
        recalcCumulativeTotals();
        // === НОВОЕ: Обновляем сводки всех маршрутов ===
        document.querySelectorAll('.route-collapsed-summary[data-route]').forEach(function(el) {
            var rn = el.getAttribute('data-route');
            if (rn) updateRouteSummary(rn);
        });
    }, 100);
}

function toggleRoute(id) {
    var elem = document.getElementById(id);
    if (elem) {
        if (!elem.classList.contains('active')) {
            elem.classList.add('active');
            applyFilters(elem);
            // === НОВОЕ: Скрываем сводку при раскрытии ===
            var acc = elem.closest('.route-accordion');
            if (acc) {
                var summary = acc.querySelector('.route-collapsed-summary');
                if (summary) summary.classList.remove('visible');
            }
        } else {
            elem.classList.remove('active');
            closeAllPopups();
            // === НОВОЕ: Показываем сводку при сворачивании ===
            var acc = elem.closest('.route-accordion');
            if (acc) {
                var summary = acc.querySelector('.route-collapsed-summary');
                if (summary) {
                    summary.classList.add('visible');
                    var rn = summary.getAttribute('data-route');
                    if (rn) updateRouteSummary(rn);
                }
            }
        }
    }
}

async function fillAllKm() {
    if (calcInProgress) { alert('Идёт расчёт, подождите...'); return; }
    if (!routeCalcIframeReady) { alert('Страница расчёта ещё загружается, подождите пару секунд.'); return; }
    
    var method = await getRouteMethodFromConfig();
    ROUTE_CALC_METHOD = method;
    
    var allTasks = [];
    var baseAddr = BASE_ADDRESSES[currentBase] || '';
    
    // Собираем задачи со всех маршрутов
    document.querySelectorAll('.route-extra[data-route]').forEach(function(extra) {
        var routeName = extra.getAttribute('data-route');
        var rc = extra.closest('.route-content');
        if (!rc) return;
        
        var userStart = getAddressStart(routeName);
        var userEnd = getAddressEnd(routeName);
        
        var parentRows = rc.querySelectorAll('tbody tr:not(.week-separator):not(.client-detail):not(.group-child)');
        parentRows.forEach(function(row) {
            var timeKey = row.getAttribute('data-time-key') || '';
            if (!timeKey) return;
            var existing = (routeData[routeName] && routeData[routeName].routeCalcResults) ? routeData[routeName].routeCalcResults[timeKey] : null;
            if (existing) return; // Уже рассчитано
            var clientsJson = row.getAttribute('data-clients-addresses') || '';
            if (!clientsJson) return;
            var clientAddresses = clientsJson.split('||').filter(function(a){ return a.trim() !== ''; });
            if (clientAddresses.length === 0) return;
            
            var startAddr = userStart || baseAddr;
            var endAddr = userEnd || baseAddr;
            var addresses = [];
            if (startAddr) addresses.push(startAddr);
            clientAddresses.forEach(function(a){ addresses.push(a); });
            if (endAddr) addresses.push(endAddr);
            
            allTasks.push({ taskId: routeName + '|||' + timeKey, addresses: addresses });
        });
    });
    
    if (allTasks.length === 0) { alert('Нет строк для расчёта (все уже рассчитаны)'); return; }
    
    var msgText = 'Рассчитать КМ для ВСЕХ маршрутов?\nВсего строк: ' + allTasks.length + '\nМетод расчёта: ' + method.toUpperCase();
    if (allTasks.length > 20) msgText += '\nЭто может занять ~' + Math.round(allTasks.length * 3 / 60) + ' мин.';
    if (!confirm(msgText)) return;
    
    calcInProgress = true;
    calcStats = { done: 0, total: allTasks.length, errors: 0, currentRoute: '_all' };
    
    // Блокируем кнопку
    var btn = document.getElementById('btnFillKm');
    if (btn) btn.disabled = true;
    
    var iframe = document.getElementById('routeCalcFrame');
    iframe.contentWindow.postMessage({ type: 'calc', method: ROUTE_CALC_METHOD, tasks: allTasks }, '*');
}

function renderConnectedAccordions() {
    // Удаляем старые аккордеоны соединённых маршрутов
    document.querySelectorAll('.connected-accordion').forEach(function(el) { el.remove(); });
    
    if (connectedRoutesStore.length === 0) return;
    
    var container = document.getElementById('container');
    var routesWrap = container.querySelector('div');
    if (!routesWrap) return;
    
    connectedRoutesStore.forEach(function(cr) {
        var acc = document.createElement('div');
        acc.className = 'route-accordion connected-accordion';
        acc.setAttribute('data-connected-id', cr.id);
        
        var header = document.createElement('div');
        header.className = 'route-header';
        header.setAttribute('onclick', 'toggleConnectedRoute(\'' + cr.id + '\')');
        header.innerHTML = '🔗 ' + cr.name + ' <span style="font-size:10pt;font-weight:normal;opacity:0.8;">(' + cr.routeNames.join(' + ') + ')</span> ▼';
        acc.appendChild(header);
        
        // Сводка
        var summaryDiv = document.createElement('div');
        summaryDiv.className = 'route-collapsed-summary visible';
        summaryDiv.setAttribute('data-connected', cr.id);
        var monthNames = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
        var curMonth = monthNames[new Date().getMonth()] + ' ' + new Date().getFullYear();
        summaryDiv.innerHTML = 
            '<span class="summary-inline si-nds"><span class="si-month">(' + curMonth + ')</span><span class="si-label">Продажи БезНДС:</span><span class="si-value">—</span></span>' +
            '<span class="summary-inline si-cost"><span class="si-label">Затраты:</span><span class="si-value">—</span></span>' +
            '<span class="summary-inline si-dohod"><span class="si-label">Доходность:</span><span class="si-value">—</span></span>';
        acc.appendChild(summaryDiv);
        
        // Контент
        var content = document.createElement('div');
        content.id = 'connected_' + cr.id;
        content.className = 'route-content';
        
        // Таблица с объединёнными данными
        var table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        
        var thead = document.createElement('thead');
        // Создаём заголовок с дополнительным столбцом "Маршруты"
        var trh = document.createElement('tr');
        var thRoute = document.createElement('th');
        thRoute.textContent = 'Маршруты';
        thRoute.style.fontWeight = 'bold';
        trh.appendChild(thRoute);
        COLUMNS.forEach(function(col) {
            var th = document.createElement('th');
            if (col.cls) th.className = col.cls;
            th.setAttribute('data-col-key', col.key);
            if (col.toggle) {
                th.innerHTML = col.label + ' <span class="col-toggle" data-group="' + col.toggle + '" onclick="event.stopPropagation(); toggleExpand(this)">▸</span>';
            } else {
                th.textContent = col.label;
            }
            trh.appendChild(th);
        });
        thead.appendChild(trh);
        table.appendChild(thead);
        
        var tbody = document.createElement('tbody');
        
        // Собираем и группируем строки из всех маршрутов по дате и плановой
        var groupedRows = {};
        
        cr.routeNames.forEach(function(routeName) {
            var sourceAcc = findAccordionByRouteName(routeName);
            if (!sourceAcc) return;
            var sourceContent = sourceAcc.querySelector('.route-content');
            if (!sourceContent) return;
            
            var sourceRows = sourceContent.querySelectorAll('tbody tr:not(.week-separator):not(.client-detail):not(.group-child)');
            sourceRows.forEach(function(row) {
                var dateKey = row.getAttribute('data-date-key') || '';
                var plan = row.getAttribute('data-plan') || '1';
                var groupKey = dateKey + '_' + plan;
                
                if (!groupedRows[groupKey]) {
                    groupedRows[groupKey] = {
                        dateKey: dateKey,
                        plan: plan,
                        routes: [],
                        rows: []
                    };
                }
                
                groupedRows[groupKey].routes.push(routeName);
                groupedRows[groupKey].rows.push(row);
            });
        });
        
        // Создаём объединённые строки
        Object.keys(groupedRows).sort().forEach(function(key) {
            var group = groupedRows[key];
            var firstRow = group.rows[0];
            
            // Суммируем показатели
            var totalSum = 0, totalClients = 0, totalReturns = 0, totalCancelled = 0;
            var totalCost = 0, totalDohod = 0;
            var totalClientCost = 0, totalRouteCost = 0;
            var allClients = [];
            
            group.rows.forEach(function(row) {
                totalSum += parseFloat(row.getAttribute('data-original-sum')) || 0;
                totalClients += parseInt(row.getAttribute('data-clients-count')) || 0;
                totalReturns += parseInt(row.getAttribute('data-returns')) || 0;
                totalCancelled += parseInt(row.getAttribute('data-cancelled')) || 0;
                totalCost += parseFloat(row.getAttribute('data-total-cost')) || 0;
                totalDohod += parseFloat(row.getAttribute('data-dohod')) || 0;
                
                // Суммируем клиентские и стоимость маршрута отдельно
                var clientCostCell = row.querySelector('td[data-col-key="exp-client"]');
                var routeCostCell = row.querySelector('td[data-col-key="exp-route"]');
                if (clientCostCell) totalClientCost += parseFloat(clientCostCell.textContent.replace(/\s/g, '')) || 0;
                if (routeCostCell) totalRouteCost += parseFloat(routeCostCell.textContent.replace(/\s/g, '')) || 0;
                
                var clients = row.getAttribute('data-clients') || '';
                if (clients) allClients = allClients.concat(clients.split('|'));
            });
            
            // Создаём новую строку
            var newRow = firstRow.cloneNode(true);
            var sumWNDS = totalSum * 100 / 122;
            var margin = sumWNDS * 0.17;
            
            newRow.setAttribute('data-original-sum', totalSum);
            newRow.setAttribute('data-clients-count', totalClients);
            newRow.setAttribute('data-clients', allClients.join('|'));
            newRow.setAttribute('data-total-cost', totalCost);
            newRow.setAttribute('data-dohod', totalDohod);
            
            // Обновляем все числовые ячейки
            var sumCell = newRow.querySelector('td[data-col-key="sum-route"]');
            if (sumCell) sumCell.textContent = fmt(totalSum);
            
            var sumNdsCell = newRow.querySelector('td[data-col-key="sum-nds"]');
            if (sumNdsCell) sumNdsCell.textContent = fmt(sumWNDS);
            
            var marginCell = newRow.querySelector('td[data-col-key="margin"]');
            if (marginCell) marginCell.textContent = fmt(margin);
            
            var expClientCell = newRow.querySelector('td[data-col-key="exp-client"]');
            if (expClientCell) expClientCell.textContent = fmt(totalClientCost);
            
            var expRouteCell = newRow.querySelector('td[data-col-key="exp-route"]');
            if (expRouteCell) expRouteCell.textContent = fmt(totalRouteCost);
            
            var clientsCell = newRow.querySelector('td[data-col-key="clients"]');
            if (clientsCell) clientsCell.textContent = totalClients;
            
            var costCell = newRow.querySelector('td[data-col-key="cost"]');
            if (costCell) costCell.innerHTML = '<span style="font-weight:bold;">' + fmt(totalCost) + '</span>';
            
            var dohodCell = newRow.querySelector('td[data-col-key="dohod"]');
            if (dohodCell) dohodCell.textContent = fmt(totalDohod);
            
            var returnsCell = newRow.querySelector('td[data-col-key="returns"]');
            if (returnsCell) returnsCell.textContent = totalReturns;
            
            var cancelledCell = newRow.querySelector('td[data-col-key="cancelled"]');
            if (cancelledCell) cancelledCell.textContent = totalCancelled;
            
            // Добавляем метку маршрутов
            var routeLabel = document.createElement('td');
            routeLabel.style.fontWeight = 'bold';
            routeLabel.style.color = '#8e44ad';
            routeLabel.style.fontSize = '8pt';
            routeLabel.textContent = group.routes.join(' + ');
            newRow.insertBefore(routeLabel, newRow.firstChild);
            
            tbody.appendChild(newRow);
        });
        
        table.appendChild(tbody);
        content.appendChild(table);
        acc.appendChild(content);
        
        routesWrap.appendChild(acc);
        
        // Обновляем сводку
        updateConnectedSummary(cr.id);
        
        // Пересчитываем накопительные итоги
        setTimeout(function() {
            recalcCumulativeTotals();
        }, 100);
    });
}

function updateConnectedSummary(crId) {
    var cr = connectedRoutesStore.find(function(c) { return c.id === crId; });
    if (!cr) return;
    
    var summaryEl = document.querySelector('.route-collapsed-summary[data-connected="' + crId + '"]');
    if (!summaryEl) return;
    
    var now = new Date();
    var currentMonth = now.getMonth();
    var currentYear = now.getFullYear();
    
    var currentMonthNds = 0, totalCost = 0, totalDohod = 0;
    
    cr.routeNames.forEach(function(routeName) {
        var sourceAcc = findAccordionByRouteName(routeName);
        if (!sourceAcc) return;
        var sourceContent = sourceAcc.querySelector('.route-content');
        if (!sourceContent) return;
        
        var rows = sourceContent.querySelectorAll('tbody tr:not(.week-separator):not(.client-detail):not(.group-child)');
        rows.forEach(function(row) {
            var dateKey = row.getAttribute('data-date-key') || '';
            if (!dateKey) return;
            var d = new Date(dateKey);
            var sum = parseFloat(row.getAttribute('data-original-sum')) || 0;
            var sumWNDS = sum * 100 / 122;
            var dohod = parseFloat(row.getAttribute('data-dohod')) || 0;
            var cost = parseFloat(row.getAttribute('data-total-cost')) || 0;
            
            totalCost += cost;
            totalDohod += dohod;
            
            if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                currentMonthNds += sumWNDS;
            }
        });
    });
    
    var ndsEl = summaryEl.querySelector('.si-nds .si-value');
    var costEl = summaryEl.querySelector('.si-cost .si-value');
    var dohodEl = summaryEl.querySelector('.si-dohod .si-value');
    
    if (ndsEl) ndsEl.textContent = fmt(currentMonthNds) + ' ₽';
    if (costEl) costEl.textContent = fmt(totalCost) + ' ₽';
    if (dohodEl) dohodEl.textContent = fmt(totalDohod) + ' ₽';
}

function toggleConnectedRoute(crId) {
    var elem = document.getElementById('connected_' + crId);
    if (elem) {
        if (!elem.classList.contains('active')) {
            elem.classList.add('active');
            var acc = elem.closest('.route-accordion');
            if (acc) {
                var summary = acc.querySelector('.route-collapsed-summary');
                if (summary) summary.classList.remove('visible');
            }
        } else {
            elem.classList.remove('active');
            var acc = elem.closest('.route-accordion');
            if (acc) {
                var summary = acc.querySelector('.route-collapsed-summary');
                if (summary) summary.classList.add('visible');
                updateConnectedSummary(crId);
            }
        }
    }
}

async function runAIAnalysis() {

            var content = acc.querySelector('.route-content');
            if (!content) return;
            
            var rows = content.querySelectorAll('tbody tr:not(.week-separator):not(.client-detail):not(.group-child)');
            var monthRevenue = 0, monthCost = 0, monthProfit = 0, totalRows = 0;
            
            rows.forEach(function(row) {
                var dateKey = row.getAttribute('data-date-key') || '';
                if (!dateKey) return;
                var d = new Date(dateKey);
                
                if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                    var sum = parseFloat(row.getAttribute('data-original-sum')) || 0;
                    var revenue = sum * 100 / 122; // Без НДС
                    var cost = parseFloat(row.getAttribute('data-total-cost')) || 0;
                    var profit = parseFloat(row.getAttribute('data-dohod')) || 0;
                    
                    monthRevenue += revenue;
                    monthCost += cost;
                    monthProfit += profit;
                    totalRows++;
                }
            });
            
            if (totalRows > 0) {
                routesData.push({
                    name: routeName,
                    revenue: Math.round(monthRevenue),
                    cost: Math.round(monthCost),
                    profit: Math.round(monthProfit),
                    trips: totalRows,
                    avgRevenue: Math.round(monthRevenue / totalRows),
                    avgProfit: Math.round(monthProfit / totalRows),
                    margin: monthRevenue > 0 ? ((monthProfit / monthRevenue) * 100).toFixed(1) : 0
                });
            }
        });
        
        if (routesData.length === 0) {
            contentEl.innerHTML = '<p style="color:#e74c3c;">❌ Нет данных для анализа</p>';
            statusEl.textContent = '';
            btnEl.disabled = false;
            return;
        }
        
        // Генерируем анализ
        var analysis = generateAIAnalysis(routesData);
        contentEl.innerHTML = analysis;
        statusEl.textContent = '✅ Анализ завершён';
        
    } catch (error) {
        console.error('Ошибка анализа:', error);
        contentEl.innerHTML = '<p style="color:#e74c3c;">❌ Ошибка при анализе: ' + error.message + '</p>';
        statusEl.textContent = '❌ Ошибка';
    }
    
    btnEl.disabled = false;
}

function generateAIAnalysis(routesData) {
    var totalRevenue = routesData.reduce(function(s, r) { return s + r.revenue; }, 0);
    var totalCost = routesData.reduce(function(s, r) { return s + r.cost; }, 0);
    var totalProfit = routesData.reduce(function(s, r) { return s + r.profit; }, 0);
    var totalTrips = routesData.reduce(function(s, r) { return s + r.trips; }, 0);
    
    var bestRoute = routesData.reduce(function(best, r) { 
        return r.profit > best.profit ? r : best; 
    }, routesData[0]);
    
    var worstRoute = routesData.reduce(function(worst, r) { 
        return r.profit < worst.profit ? r : worst; 
    }, routesData[0]);
    
    var mostEfficient = routesData.reduce(function(best, r) { 
        var margin = parseFloat(r.margin);
        var bestMargin = parseFloat(best.margin);
        return margin > bestMargin ? r : best; 
    }, routesData[0]);
    
    // Анализ по неделям
    var weeklyAnalysis = calculateWeeklyTrend(routesData);
    
    var html = '<div style="font-size: 10.5pt; line-height: 1.6;">';
    
    // Общая статистика
    html += '<h3 style="color:#667eea; margin-top:0;">📈 Общая статистика</h3>';
    html += '<p><strong>Всего маршрутов:</strong> ' + routesData.length + '</p>';
    html += '<p><strong>Общий оборот (без НДС):</strong> ' + fmt(totalRevenue) + ' ₽</p>';
    html += '<p><strong>Общие затраты:</strong> ' + fmt(totalCost) + ' ₽</p>';
    html += '<p><strong>Общая прибыль:</strong> ' + fmt(totalProfit) + ' ₽</p>';
    html += '<p><strong>Всего рейсов:</strong> ' + totalTrips + '</p>';
    html += '<p><strong>Средняя маржинальность:</strong> ' + (totalRevenue > 0 ? ((totalProfit / totalRevenue) * 100).toFixed(1) : 0) + '%</p>';
    
    // Лучший маршрут
    html += '<h3 style="color:#27ae60;">🏆 Самый прибыльный маршрут</h3>';
    html += '<p><strong>' + bestRoute.name + '</strong></p>';
    html += '<p>Прибыль: ' + fmt(bestRoute.profit) + ' ₽ | Маржа: ' + bestRoute.margin + '% | Рейсов: ' + bestRoute.trips + '</p>';
    
    // Самый эффективный
    if (mostEfficient.name !== bestRoute.name) {
        html += '<h3 style="color:#3498db;">💎 Самый эффективный маршрут</h3>';
        html += '<p><strong>' + mostEfficient.name + '</strong></p>';
        html += '<p>Маржинальность: ' + mostEfficient.margin + '% | Прибыль: ' + fmt(mostEfficient.profit) + ' ₽</p>';
    }
    
    // Проблемные маршруты
    var problemRoutes = routesData.filter(function(r) { return r.profit < 0; });
    if (problemRoutes.length > 0) {
        html += '<h3 style="color:#e74c3c;">⚠️ Убыточные маршруты</h3>';
        problemRoutes.forEach(function(r) {
            html += '<p><strong>' + r.name + ':</strong> убыток ' + fmt(Math.abs(r.profit)) + ' ₽ (маржа: ' + r.margin + '%)</p>';
        });
    }
    
    // Рекомендации
    html += '<h3 style="color:#f39c12;">💡 Рекомендации</h3>';
    html += '<ul style="margin-left: 20px;">';
    
    if (problemRoutes.length > 0) {
        html += '<li>Пересмотрите ценообразование на убыточных маршрутах: ' + problemRoutes.map(function(r) { return r.name; }).join(', ') + '</li>';
    }
    
    if (parseFloat(mostEfficient.margin) > 30) {
        html += '<li>Маршрут "' + mostEfficient.name + '" показывает высокую эффективность - рассмотрите возможность масштабирования</li>';
    }
    
    var avgTripsPerRoute = totalTrips / routesData.length;
    if (avgTripsPerRoute < 10) {
        html += '<li>Низкая интенсивность рейсов (' + avgTripsPerRoute.toFixed(1) + ' рейсов/маршрут) - возможна оптимизация графика</li>';
    }
    
    var avgMargin = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;
    if (avgMargin < 15) {
        html += '<li>Средняя маржинальность ниже 15% - рекомендуется пересмотреть затраты и ценообразование</li>';
    } else if (avgMargin > 25) {
        html += '<li>Высокая маржинальность (' + avgMargin.toFixed(1) + '%) - отличные показатели эффективности</li>';
    }
    
    html += '</ul>';
    
    // Тренд по неделям
    if (weeklyAnalysis) {
        html += '<h3 style="color:#e67e22;">📅 Тренд: Последняя неделя vs Предыдущая</h3>';
        html += '<table style="width:100%; border-collapse:collapse; margin:10px 0; font-size:10pt;">';
        html += '<tr style="background:#f8f9fa;"><th style="padding:8px; border:1px solid #ddd; text-align:left;">Маршрут</th>';
        html += '<th style="padding:8px; border:1px solid #ddd; text-align:right;">Оборот (без НДС)</th>';
        html += '<th style="padding:8px; border:1px solid #ddd; text-align:right;">Прибыль</th>';
        html += '<th style="padding:8px; border:1px solid #ddd; text-align:right;">Изменение</th></tr>';
        
        weeklyAnalysis.forEach(function(route) {
            var revenueChange = route.prevWeekRevenue > 0 
                ? ((route.lastWeekRevenue - route.prevWeekRevenue) / route.prevWeekRevenue * 100).toFixed(1)
                : 'N/A';
            var profitChange = route.prevWeekProfit !== 0 
                ? ((route.lastWeekProfit - route.prevWeekProfit) / Math.abs(route.prevWeekProfit) * 100).toFixed(1)
                : 'N/A';
            
            var revColor = revenueChange === 'N/A' ? '#666' : (parseFloat(revenueChange) >= 0 ? '#27ae60' : '#e74c3c');
            var profColor = profitChange === 'N/A' ? '#666' : (parseFloat(profitChange) >= 0 ? '#27ae60' : '#e74c3c');
            
            html += '<tr>';
            html += '<td style="padding:8px; border:1px solid #ddd;"><strong>' + route.name + '</strong></td>';
            html += '<td style="padding:8px; border:1px solid #ddd; text-align:right;">' + fmt(route.lastWeekRevenue) + ' ₽</td>';
            html += '<td style="padding:8px; border:1px solid #ddd; text-align:right;">' + fmt(route.lastWeekProfit) + ' ₽</td>';
            html += '<td style="padding:8px; border:1px solid #ddd; text-align:right;">';
            html += '<span style="color:' + revColor + ';">Оборот: ' + (revenueChange === 'N/A' ? '—' : (parseFloat(revenueChange) >= 0 ? '+' : '') + revenueChange + '%') + '</span><br>';
            html += '<span style="color:' + profColor + ';">Прибыль: ' + (profitChange === 'N/A' ? '—' : (parseFloat(profitChange) >= 0 ? '+' : '') + profitChange + '%') + '</span>';
            html += '</td></tr>';
        });
        
        html += '</table>';
    }
    
    html += '</div>';
    
    return html;
}

function calculateWeeklyTrend(routesData) {
    var now = new Date();
    var lastWeekStart = getWeekStart(now);
    lastWeekStart.setDate(lastWeekStart.getDate() - 7);
    var lastWeekEnd = new Date(lastWeekStart);
    lastWeekEnd.setDate(lastWeekEnd.getDate() + 6);
    
    var prevWeekStart = new Date(lastWeekStart);
    prevWeekStart.setDate(prevWeekStart.getDate() - 7);
    var prevWeekEnd = new Date(lastWeekStart);
    prevWeekEnd.setDate(prevWeekEnd.getDate() - 1);
    
    var result = [];
    
    document.querySelectorAll('.route-accordion:not(.connected-accordion)').forEach(function(acc) {
        var routeName = acc.querySelector('.route-header').textContent.replace(' ▼', '').trim();
        var content = acc.querySelector('.route-content');
        if (!content) return;
        
        var rows = content.querySelectorAll('tbody tr:not(.week-separator):not(.client-detail):not(.group-child)');
        var lastWeekRevenue = 0, lastWeekProfit = 0;
        var prevWeekRevenue = 0, prevWeekProfit = 0;
        
        rows.forEach(function(row) {
            var dateKey = row.getAttribute('data-date-key') || '';
            if (!dateKey) return;
            var d = new Date(dateKey);
            var sum = parseFloat(row.getAttribute('data-original-sum')) || 0;
            var revenue = sum * 100 / 122;
            var profit = parseFloat(row.getAttribute('data-dohod')) || 0;
            
            if (d >= lastWeekStart && d <= lastWeekEnd) {
                lastWeekRevenue += revenue;
                lastWeekProfit += profit;
            } else if (d >= prevWeekStart && d <= prevWeekEnd) {
                prevWeekRevenue += revenue;
                prevWeekProfit += profit;
            }
        });
        
        if (lastWeekRevenue > 0 || prevWeekRevenue > 0) {
            result.push({
                name: routeName,
                lastWeekRevenue: Math.round(lastWeekRevenue),
                lastWeekProfit: Math.round(lastWeekProfit),
                prevWeekRevenue: Math.round(prevWeekRevenue),
                prevWeekProfit: Math.round(prevWeekProfit)
            });
        }
    });
    
    return result.length > 0 ? result : null;
}

</script>
